services:

  # ─── FlashFlow ─────────────────────────────────────────────────────────────
  flashflow:
    image: ghcr.io/thiago-caffaro/flashflow:latest
    restart: always
    ports:
      - "3000:3000"
    networks:
      - flashflow-net
    depends_on:
      - evolution-api
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      WEBHOOK_BASE_URL: http://flashflow:3000
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}

  # ─── Evolution API ──────────────────────────────────────────────────────────
  evolution-api:
    image: ghcr.io/thiago-caffaro/evolution-api:2.3.7
    container_name: evolution-api
    restart: unless-stopped
    networks:
      - flashflow-net
    volumes:
      - evolution_instances:/evolution/instances
    entrypoint:
      - /bin/bash
      - -c
      - |
        cd /evolution
        cat > /tmp/ps.js << 'EOF'
        const p = process.env.GLOBAL_AGENT_HTTPS_PROXY || process.env.GLOBAL_AGENT_HTTP_PROXY;
        if (p) {
          try {
            const { HttpsProxyAgent, HttpProxyAgent } = require('/evolution/node_modules/hpagent');
            const https = require('https');
            const http = require('http');
            https.globalAgent = new HttpsProxyAgent({ proxy: p });
            http.globalAgent = new HttpProxyAgent({ proxy: p });
            process.stderr.write('proxy-setup: OK\n');
          } catch (e) {
            process.stderr.write('proxy-setup: ' + e.message + '\n');
          }
        }
        EOF
        . ./Docker/scripts/deploy_database.sh
        NODE_OPTIONS='-r /tmp/ps.js' npm run start:prod
    environment:
      TZ: America/Sao_Paulo
      DOCKER_ENV: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_ENABLED: "true"
      DATABASE_URL: ${EVOLUTION_DATABASE_TRANSACTION_URL}
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_SESSION_URL}
      DIRECT_URL: ${EVOLUTION_DATABASE_SESSION_URL}
      REDIS_ENABLED: "true"
      CACHE_REDIS_ENABLED: "true"
      REDIS_URI: ${REDIS_URL}
      CACHE_REDIS_URI: ${REDIS_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      CONFIG_SESSION_PHONE_CLIENT: FlashFlow
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1036893687
      DEL_INSTANCE_ON_LOGOUT: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://flashflow:3000/api/webhook/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "true"
      PROXY_HOST: ${PROXY_HOST}
      PROXY_PORT: ${PROXY_PORT}
      PROXY_PROTOCOL: ${PROXY_PROTOCOL}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      GLOBAL_AGENT_HTTP_PROXY: http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}
      GLOBAL_AGENT_HTTPS_PROXY: http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_HOST}:${PROXY_PORT}
      GLOBAL_AGENT_NO_PROXY: localhost,127.0.0.1,flashflow

networks:
  flashflow-net:
    driver: bridge

volumes:
  evolution_instances:
