name: Build & Push Docker Image

on:
  push: {}
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. test, staging)'
        default: 'test'
        required: false
      supabase_url:
        description: 'Supabase URL override (for test builds with dev credentials)'
        required: false
      supabase_anon_key:
        description: 'Supabase Anon Key override (for test builds with dev credentials)'
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags and resolve credentials
        id: config
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          # Manual runs use the requested tag. Every branch push publishes
          # test, while main also publishes the production latest tag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS="ghcr.io/${REPO}:${{ github.event.inputs.tag || 'test' }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS=$(printf 'ghcr.io/%s:latest\nghcr.io/%s:test' "$REPO" "$REPO")
          else
            TAGS="ghcr.io/${REPO}:test"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          # Credentials: workflow_dispatch input > branch-specific secret > prod secret fallback
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.supabase_url }}" ]; then
            echo "supabase_url=${{ github.event.inputs.supabase_url }}" >> $GITHUB_OUTPUT
            echo "supabase_anon_key=${{ github.event.inputs.supabase_anon_key }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "supabase_url=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_OUTPUT
            echo "supabase_anon_key=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_OUTPUT
          else
            echo "supabase_url=${{ secrets.DEV_NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_OUTPUT
            echo "supabase_anon_key=${{ secrets.DEV_NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.config.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_FEATURE_AI_SESSIONS=true
            NEXT_PUBLIC_FEATURE_GALLERY=true
            NEXT_PUBLIC_FEATURE_SWITCH_CASE=true
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.config.outputs.supabase_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.config.outputs.supabase_anon_key }}
